# Panasonic Toughbook CF-33 kiosk preset
# Target: 12" 2160x1440 IPS, 3:2 aspect, Intel Core i5-7300U + HD 620 (Kaby Lake, Gen9.5)
# Hardware H.264 / HEVC 8-bit / VP9 8-bit decode via VA-API — sonogram defaults are fine.
# 3:2 aspect ratio doesn't match any existing preset; that's the main reason this exists.

VIDEO_WIDTH=2160
VIDEO_HEIGHT=1440
FPS=30

# Layout: scaled from landscape.conf (1920x1080).
# Width ratio 1.125, height ratio 1.333. Geometric mean ~1.22 for font.
INFO_FONT_SIZE=42
PHOTO_BAND_HEIGHT=266

# No encoding overrides — HD 620 hardware-decodes the sonogram default
# (high profile, B-frames, CRF 18) at single-digit CPU usage.
# Audio defaults are fine; CF-33 has stereo speakers + 3.5mm out.
