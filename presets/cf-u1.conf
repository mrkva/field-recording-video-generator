# Panasonic Toughbook CF-U1 kiosk preset
# Target: 1024x600 transflective LCD, Intel Atom Z520 (single-core 1.33GHz, 32-bit)
# Software H.264 decode only — no B-frames, baseline profile, single reference frame.
# Frame rate hard-capped at 30 fps.

VIDEO_WIDTH=1024
VIDEO_HEIGHT=600
FPS=30

# Layout: scaled ~0.55x from landscape.conf (1920x1080), biased up for readability.
INFO_FONT_SIZE=20
PHOTO_BAND_HEIGHT=110

# Encoding for Atom Z520 software decode:
H264_PROFILE=baseline
H264_LEVEL=3.0
H264_PRESET=slow
H264_CRF=23
H264_BFRAMES=0
H264_REFS=1
H264_EXTRA_PARAMS=keyint=60:min-keyint=30:scenecut=40

# Audio: stereo 48kHz for the device's 3.5mm headphone jack.
AUDIO_BITRATE=192k
AUDIO_SAMPLE_RATE=48000
AUDIO_CHANNELS=2
